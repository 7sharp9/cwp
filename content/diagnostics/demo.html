<script>/*<![CDATA[*/
(function () {
  var frames = document.querySelectorAll('.cw-frame');
  var slider = document.getElementById('cw-slider');
  var label = document.getElementById('cw-label');
  var prev = document.getElementById('cw-prev');
  var next = document.getElementById('cw-next');
  function show(i) {
    if (i < 0) { i = 0; }
    if (i > frames.length - 1) { i = frames.length - 1; }
    for (var j = 0; j < frames.length; j++) {
      frames[j].setAttribute('class', (j === i) ? 'cw-frame cw-active' : 'cw-frame');
    }
    slider.value = i;
    label.textContent = 'tick ' + frames[i].getAttribute('data-tick');
  }
  slider.addEventListener('input', function () { show(parseInt(slider.value, 10)); });
  prev.addEventListener('click', function () { show(parseInt(slider.value, 10) - 1); });
  next.addEventListener('click', function () { show(parseInt(slider.value, 10) + 1); });
  show(0);
}());
/*]]>*/</script>
