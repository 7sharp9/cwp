  note: >-
    2026-09-08: TASK-028 (backlog B-017, staged order appraisal and typed
    reasons) implemented on branch task-028-order-appraisal off the TASK-027
    merge on main. Committed locally, not pushed. In review, not yet accepted.

    Prelude: TASK-027 (backlog B-016, communication constraints and order
    delivery) was committed on its branch but unaccepted; confirmed with Dave,
    then recorded acceptance and merged to main (--no-ff, branch deleted; not
    pushed).

    Eight central decisions confirmed with Dave before the phase bodies: (A)
    the Communication phase now writes a new canonical AgentState.Order
    (ReceivedOrder option) and resets AgentState.Disposition to None instead of
    writing Destination; the new Appraisal phase (slot 5, a real phase over a
    new Appraisal leaf module) reads Order + WorldState.TacticalKnowledge +
    terrain + a static AgentState.Discipline, runs stages 1-4, produces an
    OrderDisposition, emits OrderAppraised, and on Accepted writes Destination.
    Order + Disposition are genuine per-tick canonical memory, so
    Canonical.FormatVersion bumps 3 -> 4 with a full behaviour-neutral re-pin.
    (B) Discipline is a static per-deployment integer EXCLUDED from
    Canonical.encode (the CommunicationAvailable precedent); trust / stress /
    suppression deferred to B-020 / B-021. (C) stages: 1 guaranteed upstream;
    2 Pathfinding feasibility -> Unable(NoKnownRoute); 3 route exposure to
    known threats only (engagement range, Sight.visible, directional cover);
    4 exposure vs a Discipline/RiskTolerance/Urgency threshold ->
    Accepted / Refused(RouteTooExposed). OrderDisposition = Accepted | Refused
    of primary*supporting | Unable of primary*supporting; DecisionReason =
    NoKnownRoute | RouteTooExposed of AgentId option. Adapted / Delayed
    deferred (no DU cases). (D) AppraisalConfig module of integer literals, no
    PRNG; hysteresis deferred (nothing to act on in scope). (E) reappraisal
    trigger in scope: new order received only. (F) OrderAppraised of
    agent * command * disposition (reasons ride on the disposition DU). (G) no
    ADR. (H) new exposed-approach corpus entry (two friendlies of Discipline 1
    and 6 ordered along the same exposed approach past a known hostile, one
    Refused and one Accepted -- the docs/07 section 9 criterion 2 G3 evidence);
    blocked-goal repurposed as the appraisal-Unable(NoKnownRoute) case.

    New AgentState.Order / .Disposition / .Discipline; new Appraisal.fs leaf
    (AppraisalConfig + routeExposure + appraise); PlayerIntent / Urgency /
    RiskTolerance moved Commands.fs -> Domain.fs; new OrderAppraised event; new
    Overlay.OrderAppraisal (derived in frame and frameOf); new
    RawDeployment / Deployment.Discipline + ScenarioError.NegativeDiscipline.
    Canonical.FormatVersion 3 -> 4: full re-pin of the fixture + all ten
    content/replays/*.md + envelope-full.{cwreplay,md} + every
    content/diagnostics golden; tick counts unchanged on all ten entries,
    event counts moved by one OrderAppraised per order (blocked-goal /
    lost-comms unchanged at 2). New exposed-approach corpus entry + golden;
    new blocked-goal-tick-001 golden. 228 -> 242 green (+9 SimulationTests, +3 DiagnosticsTests, +1
    DeterminismPropertyTests property 8 at 200 cases, +1 CorpusTests theory
    case).
    dotnet build 0/0; -- corpus 10/10; -- fixture format 4, 34 events;
    -- replay-file envelope-full OK at canonical 4; src/CommandoWar.Sim
    packages FSharp.Core only. No ADR (ADR-0002 amendment governs the bump).
    (docs/ledger/2026-09-08-TASK-028-order-appraisal-and-typed-reasons.md)

    Newly unblocked: B-018 (commitments / finite executors -- the Appraisal
    phase now produces an Accepted disposition to build on), B-021 (stress /
    discipline / trust dynamics + the remaining reappraisal triggers +
    hysteresis; makes Discipline canonical), B-023 (canonical refusal
    sequence -- steps 1-3 landed as exposed-approach).

