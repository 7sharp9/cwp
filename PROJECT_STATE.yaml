    Prior: 2026-09-19 (review round 1): Dave live-tested TASK-056's facing/
    animation fixes and reported "its better but i dont think it always
    stay the correct facing. also theres some sort of jerkyness to the
    movement, it also also moving really fast too." Both traced to one
    shared root cause: `AgentSnapshot.Position` only changes once a whole
    grid edge completes (`Progress` accumulates across several mid-edge
    ticks first, TASK-018), but rendering lerped screen position between
    the previous and current tick's discrete `Position` alone -- identical
    on every mid-edge tick, so the figure sat frozen then snapped across a
    whole cell inside one tick's 50ms window (jerky, and reading as fast
    since the whole displacement compresses into that short burst); the
    same crow-flies-to-final-`Destination` assumption (not the immediate
    next path step) also explained facing going wrong on a bent or
    redirected route. Fixed by computing each moving agent's true next
    path cell once per tick (`Pathfinding.find`, the `committedItems`
    route-preview precedent) and using it both as `facingBin`'s target and
    the render lerp target, with the lerp fraction driven by the
    already-canonical `AgentSnapshot.Progress` normalised against a learned
    per-agent tick-count estimate (self-correcting, no `CommandoWar.Sim`
    change -- `MoveSpeed` deliberately stays unexposed to the client).
    Verified live via a temporary burst-screenshot probe (removed after
    use): confirmed continuous fractional-cell position progression (no
    flat-then-jump pattern) and a real mid-route direction change showing
    facing genuinely switch to match. `dotnet test` 343/343 unaffected;
    all three scenes' `--selfcheck` unaffected. Flagged, not changed: the
    underlying grid movement pace itself (`DemoScenario`'s Trooper
    half-speed, TASK-049) may still feel too fast once the jerkiness is
    gone -- that's content authoring outside this task's presentation-only
    scope, Dave's own call after trying the smoothed version live. Still
    `review`, not `done`.
