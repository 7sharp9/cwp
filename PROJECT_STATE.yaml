fixed_constraints:
  - Desktop-first
  - Original title and assets
  - Framework-independent F# authoritative simulation
  - Integer fixed-tick authoritative time
  - Recorded commands, deterministic random source, and replay evidence
  - One mission before campaign, vehicles, multiplayer, modding, or research expansion
  - Coding agents work from bounded task files

candidate_stack_as_researched_2026_09_02:
  dotnet: verify_installed_SDK_before_scaffolding
  godot_dotnet: 4.7.2
  monogame: 3.8.5.1
  raylib: 6.0
  mibo: 4.5.3
  tiled: 1.12.2

prohibited_before_G5:
  - Mibo.Adaptive
  - Runtime LLMs
  - Multiplayer
  - Vehicles
  - General-purpose mod scripting
  - Procedural campaign generation
  - Pairwise social relationship simulation
  - General HTN or GOAP planner
  - Full ECS migration
  - Research study instrumentation beyond ordinary telemetry and replay
