    A real bug found and fixed before it reached a test: the naive success
    gate (`Array.forall` over the scenario's `Objectives`) is vacuously true
    on an empty array, which would have made every pre-existing test fixture
    (`World.create`/`Setup.sixAgentWorld`, none of which authors objectives)
    instantly "succeed" on tick 1 -- caught immediately by the 34 test
    failures a first full run produced, fixed with one non-empty guard. A
    second, subtler instance in test content rather than product code:
    `ScenarioTests.fs`'s `fixtureScenario()` (a `Scenario`-validated
    expression of the shared six-agent fixture) already authored a real
    `reach observation` objective at agent 3's own scripted `MoveTo` target,
    on its own doc comment's explicit (now-false) assumption that
    `World.ofScenario` read neither objectives nor extraction areas --
    that fixture now genuinely reaches `MissionOutcome = Succeeded` at tick
    31, confirmed by running it, not assumed. `ObjectiveId`/`AreaId`/
    `TargetId`/`Area`/`StaticTarget`/`AgentSelection`/`Objective`/
    `ScenarioRules` moved `Scenario.fs -> Domain.fs` (the `Jammer` precedent
