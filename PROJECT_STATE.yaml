    Prior: 2026-09-17: TASK-042 review round 1. Dave tried CommandDemo.tscn and
    reported the HUD's order= text flashes by too fast to read, and
    separately noted the game loop runs faster than expected -- explicitly
    not a regression, just the first time he needed to read specific
    transient text rather than glance at a persistent value. Real: at the
    default 20 Hz sim rate, DemoScenario's short route completes in ~150ms
    wall-clock, so order=accepted appeared and reverted before it could be
    read. Fixed with a client-side, presentation-only hold timer
    (orderTextHoldSeconds = 1.5) in CommandDemoScene, tracked in
    Update(deltaSeconds); a genuinely new message still overrides
    immediately, only the fall-back to "no order" is delayed; reset on any
    selection change. No CommandoWar.Sim/hash change. Verified with a new
    headless probe driving Update(dt) directly (StepTicksHeadless/
    --selfcheck never call Update, so never exercised the hold timer):
    order=accepted now stays visible ~1.6s longer than before. Both scenes'
    --selfcheck hashes reconfirmed unchanged; dotnet build both .slnx
    (Debug and Release) 0/0; dotnet test 297/297.
    (docs/ledger/2026-09-17-TASK-042-reason-and-disposition-ui.md)

