    **Production bug found and fixed during implementation**:
    `stateConsequences`'s leadership/squad-failure diff originally compared
    against a snapshot taken at its own phase entry -- already mutated by
    Combat, which runs earlier the same tick -- so it could only ever catch
    its own bleed-out transitions, never one Combat itself just caused,
    silently dropping the event the tick it should have fired. Fixed by
    adding `StepState.InitialLeader`/`.InitialFriendlyAlive`, the true
    pre-tick baseline computed once before any phase runs; covered by a new
    `SimulationTests` fact that drives real combat rather than injecting
    state (injection cannot exercise this path). Re-pinning after the fix
    changed four pre-existing corpus entries' exact event counts a second
    time (`perception-contact`/`exposed-approach`/`suppress-relieves-exposure`/
    `canonical-refusal-and-correction`; tick counts unchanged, documented in
