  note: >-
    2026-09-08: TASK-027 (backlog B-016, communication constraints and order
    delivery) accepted by Dave and merged to main (--no-ff, branch deleted;
    not pushed). TASK-028 (backlog B-017, staged order appraisal and typed
    reasons) selected as a draft-then-implement task on branch
    task-028-order-appraisal off the TASK-027 merge. Central decisions
    confirmed with Dave before the phase bodies: (A) Communication writes a
    new canonical AgentState.Order (ReceivedOrder option) and resets
    Disposition to None; the new Appraisal phase (slot 5) reads Order +
    TacticalKnowledge + terrain + Discipline, produces an OrderDisposition,
    and writes Destination on Accepted. Order + Disposition are canonical
    per-tick memory, so Canonical.FormatVersion bumps 3 -> 4 with a full
    re-pin. (B) Discipline is a static per-deployment integer EXCLUDED from
    Canonical.encode (the CommunicationAvailable precedent); the 3 -> 4 bump
    is justified by Order + Disposition alone. Trust / stress / suppression
    deferred to B-020 / B-021. (C) stages 1-4 partial (stage 1 trivially
    passed upstream; stage 2 Pathfinding feasibility; stage 3 known-threat
    route exposure; stage 4 exposure vs resolve threshold). Outcomes:
    Accepted, Refused RouteTooExposed, Unable NoKnownRoute. Adapted / Delayed
    deferred (no DU cases). (D) AppraisalConfig module of integer literals,
    integer exposure metric, hysteresis, no PRNG. (E) reappraisal trigger in
    scope: new order received only. (F) OrderDisposition DU carries the
    reasons (Refused / Unable of primary * supporting); event is
    OrderAppraised of agent * command * disposition. (G) no ADR (ADR-0002
    amendment governs the bump). (H) G3 evidence: a corpus entry where two
    friendlies with different Discipline appraise the same order along a
    known-threat approach differently (one Refused, one Accepted).
    blocked-goal repurposed as the appraisal-Unable(NoKnownRoute) case
    (its target is unreachable, so stage 2 refuses it up front — docs/09
    section 2.2).

    Five central decisions confirmed with Dave before the phase bodies: (A)
    static per-agent CommunicationAvailable reachability check, no PRNG, flag
    excluded from Canonical.encode like Terrain; (B) the pending order is
    transient (a StepState-local list, not canonical) so Canonical.FormatVersion
    stays 3 and no hash re-pins; (C) radio range / delay / jamming /
    radio-destroyed / report aging split to a new B-016b; (D) OrderUndelivered
    only, no OrderDelivered success event (with zero delay it duplicates
    CommandAccepted); (E) no ADR.

    commandIntake now records an accepted order as a pending order rather than
    writing AgentState.Destination; the new Communication phase (slot 2)
    delivers it (writes Destination) to a recipient with
    CommunicationAvailable = true, or emits OrderUndelivered
    (UnableToCommunicate) and drops it. New AgentState.CommunicationAvailable
    (static, default true, excluded from Canonical.encode), RawDeployment /
    Deployment.CommunicationAvailable, EventBody.OrderUndelivered +
    DeliveryFailure DU, Overlay.UndeliveredOrder +
    AgentMarker.CommunicationAvailable, new lost-comms corpus entry + golden.

    ZERO re-pin: -- corpus (9/9 PASS) and -- fixture (format 3,
    0x50BFA007EDFC42FE / 0xD9D6EC3DDC1D602F, 33 events) byte-identical before
    and after, with and without --regenerate; no content/diagnostics golden
    moved; -- replay-file envelope-full checkpoints OK at canonical 3.
    216 -> 228 green; dotnet build 0/0; src/CommandoWar.Sim packages
    FSharp.Core only. No ADR.
    (docs/ledger/2026-09-07-TASK-027-communication-and-order-delivery.md)

    B-016 -> done (communication half); new B-016b (range/delay/jamming/
    radio-destroyed/report aging) proposed; B-017 (staged order appraisal)
    now has "Was the order received?" as a real fact.

    Prior context: TASK-026 (backlog B-015, observations and shared squad
    tactical knowledge — first phase consumer of the Sight module) implemented,
    accepted by Dave, and merged to main (branch
    task-026-perception-and-tactical-knowledge, --no-ff; branch deleted; not
    pushed).

    Three central decisions were confirmed with Dave before the canonical
    encoder / phase bodies were written: full retained decaying
    tactical-knowledge store (not the narrowed cut); PerceptionConfig module
    literals SightRange = 10 (Chebyshev), ConfidenceFull = 1000,
    ConfidenceBandDrop = 250, StaleAfter = 20, ExpireAfter = 60; symmetric raw
    visibility (both sides get AgentState.VisibleContacts) with
    friendly-squad-only WorldState.TacticalKnowledge.

    New leaf src/CommandoWar.Sim/Perception.fs. AgentState.VisibleContacts is
    a non-canonical derived cache (excluded from Canonical.encode);
    WorldState.TacticalKnowledge is genuine canonical state, so
    Canonical.FormatVersion bumped 2 -> 3 with a full BEHAVIOUR-NEUTRAL re-pin
    (fixture + all seven .cwlog corpus entries + envelope-full.{cwreplay,md} —
    tick counts and event counts byte-identical; every committed scenario is
    enemy-free). New ContactObserved / ContactExpired events; new
    Overlay.KnownContact in Diagnostics.frame and frameOf; new enemy-bearing
    corpus entry perception-contact (14 ticks, 12 events) + golden.
    206 -> 216 green; dotnet build 0/0; -- corpus 8/8 PASS; -- fixture
    format 3, 33 events unchanged; src/CommandoWar.Sim packages FSharp.Core
    only. No ADR (ADR-0002 amendment governs the bump).
    (docs/ledger/2026-09-07-TASK-026-perception-and-tactical-knowledge.md)

    All P3 command-loop and perception foundations are now in place. Newly
    unblocked P3 work (each consumes WorldState.TacticalKnowledge /
    AgentState.VisibleContacts): B-016 (communication constraints and report
    aging), B-017 (staged order appraisal — needs B-016), B-019 (basic
    hitscan combat and directional cover). No task file drafted for any of
    them yet.

    All feature branches merged into main and deleted; `main` is the only
    local branch and is ahead of origin/main by the TASK-025 and TASK-026
    commits — left for Dave to push.

    Earlier this session (2026-09-06): TASK-021 (B-046), TASK-022 (B-047),
    TASK-023 (B-048) recorded as accepted by Dave; TASK-023's
    .github/workflows/ci.yml is merged to main (PR #1) and green on
