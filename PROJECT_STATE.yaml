    Prior: 2026-09-19: TASK-062 (demolition objective, extraction, mission success/
    failure, realises B-032) drafted and selected. Reached via `AskUserQuestion`
    over two rounds: whether to scope B-032 now, hand-tweak the Bridgehead map
    first, push the 5 unpushed local commits, or something else (Dave chose
    scoping B-032 now); then one round of four design-fork questions, all
    answered with the recommended option -- charge-planting is occupancy-based
    (any `Alive` friendly agent on the target's own cell for a configured tick
    count, no new order type, reusing `MoveTo`/`Hold` exactly as authored
    today); failure is exactly the existing, never-consumed
    `ScenarioRules.FailOnFriendlyForceEliminated` wired up, no new timeout
    mechanism; extraction is sticky (once an agent reaches the extraction
    area it stays counted even after walking off); Bridgehead's TASK-061
    placeholder single optional "reach" objective is replaced with real
    content now (a non-optional `destroy` against the already-authored
    `bridge-charge` target and a non-optional `extract` against the
    already-authored `extraction` area), not deferred further.

    Investigation before drafting found the architecture already reserves
    this exact slot: `Phases.fs`'s fixed phase order already has a `Mission`
    case, and `Simulation.fs`'s `runPhase` already has an explicit
