  note: >-
    2026-09-13: TASK-031 (Basic hitscan combat and directional cover
    effects, backlog B-019) accepted by Dave and merged to main (--no-ff,
    branch task-031-hitscan-combat deleted; not pushed). A real Combat phase
    (docs/04 section 12.8): automatic symmetric engagement from a shooter's
    own VisibleContacts, a deterministic 0..1000-scale hit chance (range +
    directional Terrain.cover), the simulation's first real gameplay PRNG
    draw -- no Canonical.FormatVersion bump, since WorldState.Random was
    already canonical. No ammunition/weapon-readiness and no
    wound/death/suppression consequence, both deliberately deferred. New
    Combat.fs leaf, new ShotFired event, new Overlay.FireLine, new
    open-engagement corpus entry. Correction found during implementation:
    perception-contact and exposed-approach (TASK-026/028's enemy-bearing
    entries) legitimately re-pin once an agent comes into weapon range and
    line of sight of the opposing side (tick counts unchanged on both);
    demo.html similarly gains combat from tick 8. 254 -> 265 green; dotnet
    build 0/0; -- corpus 12/12; -- fixture byte-identical; -- replay-file
    envelope-full unchanged. No ADR. No task selected.
    (docs/ledger/2026-09-13-TASK-031-hitscan-combat.md)

    Newly unblocked (from TASK-031, still open): B-020 (suppression and
    exposure model) and B-022 (simple enemy hold-and-defend doctrine) both
    now have every dependency done (B-019 was the last one for each).

    Prior: TASK-030 (Commitment and finite move/hold executor, backlog
    B-018) accepted by Dave and merged to main (--no-ff, branch
    task-030-commitment-and-finite-executor deleted; not pushed) 2026-09-13.
    A real commitmentAndLocalAction phase (docs/04 section 12.6) realising a
    Commitment DU (Holding | Moving) as a pure derived value over the
    already-canonical Order/Disposition/Destination -- no
    Canonical.FormatVersion bump, no hash re-pin anywhere. New
    CommitmentEstablished / CommitmentCompleted events, new
    Overlay.AgentCommitment, new reissued-order corpus entry. 244 -> 254
    green before TASK-031 branched.
    (docs/ledger/2026-09-13-TASK-030-commitment-and-finite-executor.md)

    Prior: TASK-029 (Godot appraisal-divergence demo -- a read-only,
    corpus-scoped slice of backlog B-029 pulled forward as P3 decision-support;
    B-029 proper stays P4) accepted by Dave and merged to main (--no-ff, branch
    task-029-godot-appraisal-demo deleted; not pushed) 2026-09-12. Dave
    launched the scene interactively and confirmed the divergence reads
    right. main build 0/0, 244 green, -- corpus 10/10, -- fixture format 4 /
    34 events before TASK-030 branched.

    TASK-029 summary: a runnable Godot scene
    (src/CommandoWar.Client.Godot/scenes/AppraisalDemo.tscn +
    src/AppraisalDemoScene.cs, now run/main_scene; the greybox spike files
    untouched) loads the committed exposed-approach corpus entry, builds its
    DiagnosticFrame sequence via DiagnosticRender.runFrames, and renders the
    KnownContact / PlannedPath / OrderAppraisal overlays with a 13-frame tick
    slider and a tick/hash/format/draws HUD -- the visual proof of docs/07
    section 9 criteria 2 and 11. All non-trivial logic (corpus load,
    runFrames, disposition -> text/tone, the flat [<CLIMutable>] view model)
    lives in a new framework-neutral F# helper
    src/CommandoWar.Headless/AppraisalDemo.fs; the C# scene is a thin renderer
    (a scoped deviation from ADR-0004's "F# client-core" rule for this
    disposable demo, not a precedent for the P4 client tasks). No
    CommandoWar.Sim change; no new event / Overlay case /
    Canonical.FormatVersion bump / golden re-pin; no new NuGet/Godot
    dependency. 242 -> 244 green (+2 DiagnosticsTests). No ADR.
    (docs/ledger/2026-09-08-TASK-029-godot-appraisal-demo.md)

    Prior: TASK-028 (backlog B-017, staged order appraisal and typed reasons)
    accepted by Dave and merged to main (--no-ff, branch deleted; not pushed)
    2026-09-08. Realised the Appraisal phase (12.5): Communication writes a
    new canonical AgentState.Order (resets Disposition); Appraisal reads Order
    + TacticalKnowledge + terrain + a static AgentState.Discipline, runs
    stages 1-4, produces an OrderDisposition, emits OrderAppraised, and on
    Accepted writes Destination. Canonical.FormatVersion 3 -> 4 (full
    behaviour-neutral re-pin). New exposed-approach corpus entry (the G3
    divergence TASK-029 now visualises: agent 0 Refused RouteTooExposed
    threat-agent-2, agent 1 Accepted). 228 -> 242 green.
    (docs/ledger/2026-09-08-TASK-028-order-appraisal-and-typed-reasons.md)

    Newly unblocked (from TASK-028, still open): B-018 (commitments / finite
    executors -- the Appraisal phase now produces an Accepted disposition to
    build on), B-021 (stress / discipline / trust dynamics + the remaining
    reappraisal triggers + hysteresis; makes Discipline canonical), B-023
    (canonical refusal sequence -- steps 1-3 landed as exposed-approach).

