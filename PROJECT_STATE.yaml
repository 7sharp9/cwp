    Prior: 2026-09-20: Dave playtested TASK-064's round-2 fixes live and reported:
    "you can see whos in charge, i expected the ai to be more autonomous,
    they all seem to just get stuck ... you should ply test it." Rather
    than reason from the report alone, drove the exact same click path
    with a `dotnet fsi` probe (removed after use): an ordinary six-agent
    squad-movement order (not toward the bridge, not adversarial in any
    way) left two agents permanently stalled from tick ~30 through tick
    500 (25 real seconds at 20Hz) with zero recovery and zero indication
    anything was wrong.

    Root cause is a known, already-documented, already-`open` risk
    materialising for the first time, not a fresh defect:
    `docs/04_SIMULATION_SPEC.md`'s own movement spec names "replan when
    the next path cell becomes invalid" as step 6, but TASK-015/017's own
    realisation note says outright that a same-tick reservation yield
    never forces that replan, so ordinary multi-agent contention never
    exercises it either; `Pathfinding.fs` itself has no concept of agent
    occupancy at all, so a cached route whose next cell is permanently
    occupied by an agent that has itself already stopped moving is a dead
    end forever. This is exactly `docs/10_RISK_REGISTER.md` R-010
    ("reservation deadlocks", impact/probability 4/4, `open`) and
    `docs/01_ADVERSARIAL_REVIEW.md`'s own pre-mortem -- B-011b's title
    promised "deadlock avoidance" but TASK-017 narrowed it to same-tick
    reservation alone, and no follow-up row ever picked the rest back up.
    Small synthetic fixtures never had enough agents sharing enough
    narrow terrain to trigger it; Bridgehead's real six-agent squad
    (TASK-064) is the first content that does.

    Scoped, not implemented: confirmed via `AskUserQuestion` to pursue the
    smaller, safer of two fix directions -- turn a too-long-stalled order
    into a visible failure (clear `Destination`, emit a new event) rather
    than making `Pathfinding` itself occupancy-aware (bigger, contract-
    changing, corpus/determinism-risking, deferred as a further, larger
    follow-up if this alone proves insufficient). New backlog row B-065;
    new `tasks/TASK-065-STALLED-ORDER-VISIBLE-FAILURE.md` (status
    `proposed`) -- no `CommandoWar.Sim` code changed yet.

    `active_work.selected_task` stays `TASK-064` (still `review`, still
    awaiting Dave on the pre-existing criterion-7/3 finding and B-022);
    TASK-065 is scoped but not yet selected/started.
