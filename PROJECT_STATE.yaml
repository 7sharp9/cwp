    Prior: 2026-09-19 (review round 2): Dave tried again and reported "i just tried
    again and it seemed the same, did you not fix this?", plus two new,
    specific observations round 1's own probe never checked: the selection
    halo "jumps between cells", and the run animation "runs continously if
    the agents get stuck on the same cell". Ruled out a stale build first
    (rebuilt both `.slnx` clean from the round-1 source). Root cause: round
    1's fix only ever updated the real figure's own render position --
    `haloItems` (the selection halo) still read the raw, discrete `Position`
    directly, so it kept snapping a whole cell at a time on every edge
    completion even though the figure under it had already smoothed out;
    since the halo is the single largest, most attention-grabbing element
    while watching a selected agent move, this alone made the whole fix
    read as unchanged. Separately, `isMoving` was still just "has an unmet
    `Destination`", true forever for an agent stalled by a
    route-reservation contest (`Simulation.navigationAndMovement` freezes
    such an agent's `Progress`, never increments it, while `Destination`
    stays set) -- so the run-cycle animation played forever on a figure
    that was not actually advancing, and the render-time `alpha` ramp kept
    getting credited to an edge that would never complete, producing a
    small creep-then-snap-back sawtooth on top of that. Fixed with one new
    `stalled` map (recomputed fresh each tick from a `Progress`-unchanged
    comparison) and one new shared `renderPos` helper that the real figure
    and the selection halo both now call, so they cannot disagree; while
    `stalled`, the render position freezes exactly and the run cycle stops.
    Verified live through the real Godot 4.7.2 editor with a temporary,
    fully-removed `--stall-probe` hook and a purpose-built scenario (an
    agent redirected into a second, stationary agent's own occupied cell,
    forcing a genuine stall): a pixel-diff across 16 consecutive captures
    spanning 2.4 real seconds of the stalled state shows zero changed
    pixels, proving the figure, halo, and run-cycle frame are all fully
    static (`docs/evidence/task-056-round2-halo-and-stall-freeze.png`).
    One unexplained, single-frame, transient colour glitch was
    investigated (ruled out combat/vitals; the colour fields involved are
    untouched by this round's diff) but not resolved -- flagged for
    awareness, does not recur, does not affect either reported defect.
    `dotnet test` 343/343 unaffected; all three scenes' `--selfcheck`
    hashes unaffected. B-052 stays `review`, not `done` -- all three
    rounds' fixes await Dave's live acceptance.
