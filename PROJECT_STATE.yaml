  updated: 2026-09-06
  note: >-
    2026-09-06: nothing selected. The three post-G2 P3 correctness /
    infrastructure fixes the standing review raised are all done and accepted
    by Dave — TASK-021 (backlog B-046, passable move-cost bounds + overflow-safe
    pathfinding cost), TASK-022 (B-047, runtime cell-occupancy correctness in
    the Navigation and movement phase), TASK-023 (B-048, framework-neutral CI).
    TASK-023's .github/workflows/ci.yml is merged to main (PR #1) and green on
    windows-latest. Current state of the framework-neutral suite: dotnet test
    Passed: 194; Canonical.FormatVersion 2; -- corpus (7 entries) and
    -- fixture reproduce every committed hash on every push.
    (docs/ledger/2026-09-06-reconcile-021-022-023-acceptances.md)

    This session then drafted the next three P3 task files, file-only — no
    source, no .fsproj, no test, no hash, no Canonical.FormatVersion change —
    in dependency order:

      - TASK-024 (backlog B-044) — issue-tick / submission-tick semantics.
        Mandatory before G3 (docs/08 section 6). A decision-plus-minimal-
        implementation task: settle what PlayerCommand.IssueTick means
        (authored / submission / acceptance time), whether future-dated and
        stale commands queue or reject, whether replay tick and issue tick are
        independent, and whether command scheduling / identity is authoritative
        state (which bounds cross-tick duplicate-CommandId handling that
        TASK-020 only handled within a batch). Likely renames to IssuedAtTick /
        SubmitAtTick. (docs/ledger/2026-09-06-TASK-024-drafted.md)

      - TASK-025 (backlog B-045) — production replay-command serialisation.
        Mandatory before G3. Depends on TASK-024. After TASK-020 the .cwlog
        grammar is a frozen legacy fixture-script format that cannot express
        multi-recipient addressing, Urgency, RiskTolerance, or a distinct issue
        tick; this task adds a versioned lossless replay-command format so G3
        replay reproduces the complete decision trace. Stated .cwlog / corpus /
        Canonical.FormatVersion blast radius. B-045 stays proposed (not ready)
        until TASK-024 lands, per backlog section 1.
        (docs/ledger/2026-09-06-TASK-025-drafted.md)

      - TASK-026 (backlog B-015) — observations and shared squad tactical
        knowledge. First phase consumer of the Sight module (Perception, phase
        12.3; Tactical knowledge, 12.4). Independent of TASK-024 / TASK-025.
        Adds WorldState.TacticalKnowledge — genuine per-tick canonical state,
        Canonical.FormatVersion 2 -> 3 with a full behaviour-neutral hash
        re-pin (the TASK-018 precedent) — a known-contact diagnostic overlay
        with a committed golden, and the first enemy-bearing corpus entry.
        (docs/ledger/2026-09-06-TASK-026-drafted.md)

      Recommended selection order when Dave resumes: TASK-024, then TASK-025
      (its dependency), then TASK-026 or the B-016 / B-017 appraisal chain.
      Nothing is selected and nothing is implemented here.

    G2 passed 2026-09-05 (docs/ledger/2026-09-05-G2-gate-decision.md); phase
    P3, gate G3 (pending). ADR-0001 (Godot) stands; ADR-0003's 2026-09-06
    amendment records Mibo 5.x classic MVU as a live reconsideration option
    (backlog B-043); the framework decision is unchanged.

